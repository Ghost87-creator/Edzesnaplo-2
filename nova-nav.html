<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#090D13"/>
<title>NOVA — Navigáció</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100dvh;background:#090D13;color:#F0F5FA;font-family:-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}

:root{
  --bg:#090D13; --bg2:#111620; --bg3:#1A2030;
  --acc:#00D9F0; --text:#F0F5FA; --muted:#5E7080; --border:rgba(255,255,255,0.07);
  --green:#00D48C; --red:#FF4455; --orange:#FF8C42;
  --route:#4AABFF; --glass:rgba(9,13,19,0.88); --glass2:rgba(17,22,32,0.94);
  --radius:14px; --blur:blur(24px);
}

/* ── MAP ── */
#map{position:fixed;inset:0;z-index:0;}
.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right,.maplibregl-ctrl-top-right{display:none!important;}
.maplibregl-canvas-container,.maplibregl-canvas{width:100%!important;height:100%!important;}

/* ── LOADING ── */
#loading{
  position:fixed;inset:0;z-index:900;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  transition:opacity 0.6s;
}
.brand{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--acc);line-height:1;}
.tagline{font-size:11px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.spinner{width:32px;height:32px;border:3px solid var(--bg3);border-top-color:var(--acc);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:none;}}
@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(0,217,240,.55);}70%{box-shadow:0 0 0 16px rgba(0,217,240,0);}100%{box-shadow:0 0 0 0 rgba(0,217,240,0);}}

/* ── TURN PANEL ── */
#turn-panel{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--acc);
  padding:calc(env(safe-area-inset-top)+14px) 20px 20px;
  display:none;gap:16px;align-items:center;
  box-shadow:0 8px 48px rgba(0,217,240,0.3);
}
#turn-panel.on{display:flex;animation:slideDown 0.25s ease;}
#turn-box{width:88px;height:88px;border-radius:18px;background:rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#turn-svg{width:56px;height:56px;color:#000;overflow:visible;}
#turn-dist{font-size:52px;font-weight:800;color:#000;line-height:1;letter-spacing:-1.5px;}
#turn-road{font-size:19px;color:rgba(0,0,0,0.65);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── TOP BAR ── */
#top-bar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:calc(env(safe-area-inset-top)+10px) 12px 10px;
  display:flex;gap:10px;align-items:center;
}
.pill{
  background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:var(--radius);transition:border-color 0.2s;
}
#search-wrap{flex:1;display:flex;align-items:center;gap:10px;padding:13px 16px;}
#search-wrap:focus-within{border-color:var(--acc);}
#search-input{flex:1;background:none;border:none;color:var(--text);font-size:16px;outline:none;min-width:0;}
#search-input::placeholder{color:var(--muted);}
#clear-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:none;padding:0 2px;line-height:1;}
.icon-btn{width:50px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;}

/* ── RESULTS ── */
#results{
  position:fixed;top:82px;left:12px;right:12px;z-index:300;
  background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:16px;
  display:none;max-height:58dvh;overflow-y:auto;
  box-shadow:0 24px 64px rgba(0,0,0,0.55);
}
.r-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.1s;}
.r-item:last-child{border-bottom:none;}
.r-item:active{background:rgba(255,255,255,0.04);}
.r-ico{width:40px;height:40px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.r-name{font-size:15px;font-weight:600;}
.r-addr{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── STATUS ── */
#status{
  position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:150;
  background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);border-radius:24px;
  padding:9px 22px;font-size:13px;color:var(--muted);
  display:none;white-space:nowrap;
}

/* ── BOTTOM HUD ── */
#hud{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--border);
  padding:16px 14px calc(env(safe-area-inset-bottom)+14px);
}
#start-btn{
  width:100%;background:var(--acc);color:#000;border:none;border-radius:14px;
  padding:18px;font-size:17px;font-weight:700;cursor:pointer;
  display:none;margin-bottom:14px;transition:opacity 0.15s;
}
#start-btn:active{opacity:0.82;}
#route-row{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;display:none;}
#rt-time{font-size:34px;font-weight:700;line-height:1;}
#rt-dist{font-size:13px;color:var(--muted);margin-top:3px;}
#rt-eta{text-align:right;}
#rt-eta-val{font-size:20px;font-weight:700;color:var(--acc);}
#rt-eta-lbl{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px;}
#speed-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
#speed-box{
  background:var(--bg3);border:1px solid var(--border);border-radius:14px;
  padding:10px 18px;display:flex;flex-direction:column;align-items:center;flex-shrink:0;
  min-width:90px;transition:background 0.35s,border-color 0.35s;
}
#speed-num{font-size:56px;font-weight:900;color:var(--text);line-height:1;letter-spacing:-2px;}
#speed-unit{font-size:9px;color:var(--muted);letter-spacing:3px;margin-top:2px;}
#speed-box.warn{background:rgba(255,68,85,0.18);border-color:var(--red);}
#speed-box.warn #speed-num{color:var(--red);}
#road-box{flex:1;min-width:0;}
#road-main{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
#road-sub{font-size:13px;color:var(--muted);}
#reports{display:flex;gap:6px;}
.rpt{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:transform 0.12s,background 0.12s;}
.rpt:active{transform:scale(0.92);background:var(--bg2);}
.rpt-i{font-size:22px;line-height:1;}
.rpt-l{font-size:8px;color:var(--muted);letter-spacing:0.3px;font-weight:700;text-transform:uppercase;}

/* ── FLOAT BUTTONS ── */
#fbtns{position:fixed;right:12px;bottom:230px;z-index:100;display:flex;flex-direction:column;gap:8px;}
.fb{
  width:46px;height:46px;border-radius:12px;
  background:var(--glass2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:pointer;font-size:20px;font-weight:700;transition:all 0.15s;
}
.fb:active{transform:scale(0.92);}
.fb.on{background:var(--acc);color:#000;border-color:var(--acc);}
#recenter{display:none;}

/* ── STOP BTN ── */
#stop-btn{
  position:fixed;left:14px;z-index:210;
  background:var(--red);color:#fff;border:none;border-radius:24px;
  padding:11px 24px;font-size:14px;font-weight:700;cursor:pointer;
  display:none;box-shadow:0 4px 24px rgba(255,68,85,0.4);
}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:235px;left:50%;transform:translateX(-50%);z-index:500;
  background:var(--bg2);border:1px solid var(--border);border-radius:24px;
  padding:10px 26px;font-size:14px;font-weight:500;white-space:nowrap;
  box-shadow:0 8px 40px rgba(0,0,0,0.5);display:none;animation:fadeUp 0.2s ease;
}

/* ── USER MARKER ── */
.u-dot{width:22px;height:22px;background:var(--acc);border-radius:50%;border:3px solid #fff;animation:ripple 1.8s ease infinite;}
.u-arrow{
  width:0;height:0;
  border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:28px solid var(--acc);
  filter:drop-shadow(0 2px 8px rgba(0,217,240,0.7));
  transform-origin:50% 100%;
}
</style>
</head>
<body>
<div id="map"></div>

<!-- Loading -->
<div id="loading">
  <div class="brand">NOVA</div>
  <div class="tagline">3D Navigáció</div>
  <div class="spinner"></div>
</div>

<!-- Turn panel -->
<div id="turn-panel">
  <div id="turn-box">
    <svg id="turn-svg" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path id="turn-path" d="M28 8L28 48M28 8L16 20M28 8L40 20"/>
    </svg>
  </div>
  <div>
    <div id="turn-dist">—</div>
    <div id="turn-road">Navigáció...</div>
  </div>
</div>

<!-- Top search -->
<div id="top-bar">
  <div class="pill" id="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" style="flex-shrink:0">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search-input" type="text" placeholder="Hová mész?" autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="clear-btn">✕</button>
  </div>
  <button class="pill icon-btn" id="menu-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="5" r="1.5" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
      <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
    </svg>
  </button>
</div>

<div id="results"></div>
<div id="status"></div>
<button id="stop-btn">✕ Leállítás</button>

<!-- Float buttons -->
<div id="fbtns">
  <button class="fb" id="recenter">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
    </svg>
  </button>
  <button class="fb on" id="tilt-btn" title="3D nézet">3D</button>
  <button class="fb" id="zin">+</button>
  <button class="fb" id="zout">−</button>
</div>

<!-- Bottom HUD -->
<div id="hud">
  <button id="start-btn">▶&nbsp; Navigáció indítása</button>
  <div id="route-row">
    <div>
      <div id="rt-time">—</div>
      <div id="rt-dist">Számítás...</div>
    </div>
    <div id="rt-eta">
      <div id="rt-eta-val">—:—</div>
      <div id="rt-eta-lbl">ÉRKEZÉS</div>
    </div>
  </div>
  <div id="speed-row">
    <div id="speed-box">
      <div id="speed-num">0</div>
      <div id="speed-unit">KM/H</div>
    </div>
    <div id="road-box">
      <div id="road-main">GPS indítása...</div>
      <div id="road-sub">Helymeghatározás</div>
    </div>
  </div>
  <div id="reports">
    <button class="rpt" data-icon="🚔" data-label="Rendőr"><span class="rpt-i">🚔</span><span class="rpt-l">Rendőr</span></button>
    <button class="rpt" data-icon="⚠️" data-label="Veszély"><span class="rpt-i">⚠️</span><span class="rpt-l">Veszély</span></button>
    <button class="rpt" data-icon="💥" data-label="Baleset"><span class="rpt-i">💥</span><span class="rpt-l">Baleset</span></button>
    <button class="rpt" data-icon="📷" data-label="Kamera"><span class="rpt-i">📷</span><span class="rpt-l">Kamera</span></button>
    <button class="rpt" data-icon="🚦" data-label="Dugó"><span class="rpt-i">🚦</span><span class="rpt-l">Dugó</span></button>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
'use strict';

/* ── STATE ── */
const S = {
  pos: null, dest: null,
  nav: false, track: true,
  steps: [], stepIdx: 0,
  is3d: true,
};

/* ── MAP ── */
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
  center: [19.0402, 47.4979],
  zoom: 15,
  pitch: 45,
  bearing: 0,
  antialias: true,
});

let userMarker = null, destMarker = null, mapReady = false;

map.on('load', () => {
  mapReady = true;
  add3DBuildings();
  if (S.pos) updateUserMarker();
});

function add3DBuildings() {
  const layers = map.getStyle().layers;
  const bldLayer = layers.find(l => l['source-layer'] === 'building');
  if (!bldLayer) return;

  // Hide flat building layers
  layers
    .filter(l => l['source-layer'] === 'building')
    .forEach(l => map.setLayoutProperty(l.id, 'visibility', 'none'));

  map.addLayer({
    id: 'nova-bld-3d',
    type: 'fill-extrusion',
    source: bldLayer.source,
    'source-layer': 'building',
    minzoom: 13,
    paint: {
      'fill-extrusion-color': [
        'interpolate', ['linear'], ['coalesce', ['get', 'height'], 8],
        0, '#16213A', 20, '#1C2B46', 60, '#223355', 120, '#283D64',
      ],
      'fill-extrusion-height': ['coalesce', ['get', 'height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'min_height'], 0],
      'fill-extrusion-opacity': 0.9,
    },
  });
}

/* ── DOM ── */
const $ = id => document.getElementById(id);
const D = {
  loading:  $('loading'),
  topBar:   $('top-bar'),
  si:       $('search-input'),
  clearBtn: $('clear-btn'),
  results:  $('results'),
  status:   $('status'),
  tp:       $('turn-panel'),
  tpath:    $('turn-path'),
  tdist:    $('turn-dist'),
  troad:    $('turn-road'),
  startBtn: $('start-btn'),
  routeRow: $('route-row'),
  rtTime:   $('rt-time'),
  rtDist:   $('rt-dist'),
  rtEta:    $('rt-eta-val'),
  sNum:     $('speed-num'),
  sBox:     $('speed-box'),
  roadMain: $('road-main'),
  roadSub:  $('road-sub'),
  stopBtn:  $('stop-btn'),
  recenter: $('recenter'),
  tiltBtn:  $('tilt-btn'),
  toast:    $('toast'),
};

/* ── UTILS ── */
let toastT;
function toast(msg, dur=2600) {
  D.toast.textContent = msg; D.toast.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => D.toast.style.display = 'none', dur);
}
function fmtDist(m) {
  if (m < 250) return Math.round(m / 10) * 10 + ' m';
  if (m < 1000) return Math.round(m / 50) * 50 + ' m';
  return (m / 1000).toFixed(1).replace('.', ',') + ' km';
}
function fmtTime(s) {
  const m = Math.round(s / 60);
  return m < 60 ? m + ' perc' : Math.floor(m/60) + ' ó ' + (m%60 ? m%60+' p' : '');
}
function fmtEta(s) {
  const d = new Date(Date.now() + s * 1000);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000, r = Math.PI/180;
  const dLat = (lat2-lat1)*r, dLng = (lng2-lng1)*r;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── GPS ── */
function initGPS() {
  showStatus('GPS keresése...');
  if (!navigator.geolocation) { showStatus('GPS nem elérhető'); fallback(); return; }
  navigator.geolocation.watchPosition(onPos, onPosErr, {
    enableHighAccuracy: true, maximumAge: 3000, timeout: 25000,
  });
}

function onPos(p) {
  const { latitude: lat, longitude: lng, speed, heading, accuracy } = p.coords;
  const kmh = speed != null ? Math.round(speed * 3.6) : 0;
  S.pos = { lat, lng, speed: kmh, heading: heading ?? 0, accuracy };
  if (mapReady) updateUserMarker();
  updateSpeed(kmh);
  if (S.track) followUser(lng, lat, heading, kmh);
  hideStatus(); hideLoading();
  if (S.nav) syncStep();
  else refreshRoadName(lat, lng);
}

function onPosErr(e) {
  showStatus('GPS hiba – demo mód'); fallback();
}

function fallback() {
  S.pos = { lat: 47.4979, lng: 19.0402, speed: 0, heading: 0, accuracy: 80 };
  if (mapReady) updateUserMarker();
  setTimeout(hideLoading, 1200);
}

function followUser(lng, lat, heading, speed) {
  const pitch = S.nav ? 60 : 45;
  const bearing = S.nav && speed > 2 && heading != null ? heading : map.getBearing();
  map.easeTo({ center: [lng, lat], pitch, bearing, duration: 600 });
}

/* ── MARKERS ── */
function updateUserMarker() {
  const { lat, lng, heading, speed } = S.pos;
  const useArrow = S.nav && speed > 2;
  const el = document.createElement('div');
  if (useArrow) {
    el.className = 'u-arrow';
    el.style.transform = `rotate(${heading}deg)`;
  } else {
    el.className = 'u-dot';
  }
  if (userMarker) {
    userMarker.setLngLat([lng, lat]);
    const existing = userMarker.getElement();
    existing.className = el.className;
    existing.style.transform = el.style.transform || '';
  } else {
    userMarker = new maplibregl.Marker({ element: el, anchor: useArrow ? 'bottom' : 'center' })
      .setLngLat([lng, lat]).addTo(map);
  }
}

function placeDestMarker(lat, lng) {
  if (destMarker) destMarker.remove();
  const el = document.createElement('div');
  el.innerHTML = `<svg viewBox="0 0 36 44" width="36" height="44"><path d="M18 0C8.6 0 1 7.8 1 17.4C1 29.6 18 44 18 44S35 29.6 35 17.4C35 7.8 27.4 0 18 0Z" fill="#4AABFF"/><circle cx="18" cy="17" r="7" fill="white"/></svg>`;
  destMarker = new maplibregl.Marker({ element: el, anchor: 'bottom' })
    .setLngLat([lng, lat]).addTo(map);
}

/* ── SPEED ── */
function updateSpeed(kmh) {
  D.sNum.textContent = kmh;
  D.sBox.classList.toggle('warn', kmh > 120);
}

/* ── ROAD NAME ── */
let rnT;
async function refreshRoadName(lat, lng) {
  clearTimeout(rnT);
  rnT = setTimeout(async () => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17`);
      const d = await r.json();
      D.roadMain.textContent = d.address?.road || d.address?.pedestrian || d.display_name.split(',')[0] || 'Ismeretlen út';
      D.roadSub.textContent = d.address?.city || d.address?.town || d.address?.suburb || '';
    } catch(_) {}
  }, 4000);
}

/* ── SEARCH ── */
let searchT, abortCtrl;
D.si.addEventListener('input', e => {
  const q = e.target.value.trim();
  D.clearBtn.style.display = q ? 'block' : 'none';
  clearTimeout(searchT);
  if (q.length < 3) { hideResults(); return; }
  searchT = setTimeout(() => doSearch(q), 480);
});
D.si.addEventListener('focus', () => { if (D.si.value.trim().length >= 3) doSearch(D.si.value.trim()); });
D.clearBtn.addEventListener('click', () => {
  D.si.value = ''; D.clearBtn.style.display = 'none';
  hideResults(); clearDest();
});

async function doSearch(q) {
  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();
  D.results.innerHTML = `<div class="r-item"><div class="r-ico">🔍</div><div><div class="r-name" style="color:var(--muted)">Keresés...</div></div></div>`;
  D.results.style.display = 'block';
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6&addressdetails=1&accept-language=hu`;
    const r = await fetch(url, { signal: abortCtrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    renderResults(await r.json());
  } catch(e) {
    if (e.name !== 'AbortError')
      D.results.innerHTML = `<div class="r-item"><div class="r-ico">⚠️</div><div><div class="r-name" style="color:var(--red)">Hiba – ellenőrizd az internetet</div></div></div>`;
  }
}

const PICO = { restaurant:'🍽️', fast_food:'🍔', cafe:'☕', fuel:'⛽', hospital:'🏥', pharmacy:'💊', parking:'🅿️', supermarket:'🛒', hotel:'🏨', school:'🏫', bank:'🏦', cinema:'🎬', park:'🌿' };

function renderResults(data) {
  if (!data.length) {
    D.results.innerHTML = `<div class="r-item"><div class="r-ico">🔍</div><div><div class="r-name" style="color:var(--muted)">Nincs találat</div></div></div>`;
    return;
  }
  D.results.innerHTML = data.map(d => {
    const name = d.name || d.display_name.split(',')[0];
    const addr = d.display_name.replace(name,'').replace(/^,\s*/,'').split(',').slice(0,2).join(', ');
    const ico = PICO[d.type] || (d.class === 'highway' ? '🛣️' : d.class === 'place' ? '🏙️' : '📍');
    return `<div class="r-item" data-lat="${d.lat}" data-lon="${d.lon}" data-name="${esc(name)}">
      <div class="r-ico">${ico}</div>
      <div style="flex:1;min-width:0;"><div class="r-name">${esc(name)}</div><div class="r-addr">${esc(addr)}</div></div>
    </div>`;
  }).join('');
}

D.results.addEventListener('click', e => {
  const item = e.target.closest('.r-item[data-lat]');
  if (!item) return;
  pickDest(parseFloat(item.dataset.lat), parseFloat(item.dataset.lon), item.dataset.name);
  D.si.value = item.dataset.name;
});
function hideResults() { D.results.style.display = 'none'; }

/* ── DESTINATION ── */
function pickDest(lat, lng, name) {
  S.dest = { lat, lng, name };
  D.si.blur(); hideResults();
  placeDestMarker(lat, lng);
  D.roadMain.textContent = name; D.roadSub.textContent = 'Célpont';
  D.startBtn.style.display = 'block';
  D.routeRow.style.display = 'flex';
  D.rtTime.textContent = '...'; D.rtDist.textContent = 'Számítás...';
  S.track = false; D.recenter.style.display = 'flex';
  if (S.pos) map.fitBounds([[S.pos.lng, S.pos.lat],[lng, lat]], { padding: 90, maxZoom: 16 });
  else map.setCenter([lng, lat]);
  calcRoute();
}

map.on('click', async e => {
  if (S.nav) return;
  const { lat, lng } = e.lngLat;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17`);
    const d = await r.json();
    const name = d.address?.road || d.display_name.split(',')[0] || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    pickDest(lat, lng, name);
    D.si.value = name; D.clearBtn.style.display = 'block';
  } catch(_) { pickDest(lat, lng, `${lat.toFixed(4)}, ${lng.toFixed(4)}`); }
});

function clearDest() {
  S.dest = null;
  D.startBtn.style.display = 'none'; D.routeRow.style.display = 'none';
  if (destMarker) { destMarker.remove(); destMarker = null; }
  removeRoute();
  D.roadMain.textContent = 'Hová mész?'; D.roadSub.textContent = '';
}

/* ── ROUTING (OSRM direct) ── */
async function calcRoute() {
  if (!S.pos || !S.dest) return;
  try {
    const { pos, dest } = S;
    const url = `https://router.project-osrm.org/route/v1/driving/${pos.lng},${pos.lat};${dest.lng},${dest.lat}?steps=true&geometries=geojson&overview=full`;
    const r = await fetch(url);
    const data = await r.json();
    if (data.code !== 'Ok' || !data.routes.length) { toast('Útvonal nem található'); return; }
    const rt = data.routes[0];
    S.steps = parseSteps(rt.legs[0].steps);
    D.rtTime.textContent = fmtTime(rt.duration);
    D.rtDist.textContent = fmtDist(rt.distance);
    D.rtEta.textContent = fmtEta(rt.duration);
    drawRoute(rt.geometry);
  } catch(e) { toast('Útvonal hiba – ellenőrizd az internetet'); }
}

function drawRoute(geometry) {
  if (!mapReady) { map.once('load', () => drawRoute(geometry)); return; }
  if (map.getSource('route')) {
    map.getSource('route').setData(geometry); return;
  }
  map.addSource('route', { type: 'geojson', data: geometry });
  map.addLayer({ id: 'route-glow', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#8DD4FF', 'line-width': 16, 'line-opacity': 0.25, 'line-blur': 4 }
  });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route',
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#4AABFF', 'line-width': 8, 'line-opacity': 0.95 }
  });
}

function removeRoute() {
  ['route-line','route-glow'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  if (map.getSource('route')) map.removeSource('route');
}

/* ── OSRM STEPS PARSER ── */
function parseSteps(steps) {
  return steps.map(s => ({
    type: maneuverToType(s.maneuver.type, s.maneuver.modifier),
    road: s.name || '',
    distance: s.distance,
    text: toHungarian(s.maneuver.type, s.maneuver.modifier, s.name),
    waypoint: s.maneuver.location ? { lat: s.maneuver.location[1], lng: s.maneuver.location[0] } : null,
  }));
}

function maneuverToType(type, mod) {
  if (type === 'arrive') return 'DestinationReached';
  if (type === 'depart') return 'Straight';
  if (type === 'roundabout' || type === 'rotary') return 'Roundabout';
  const m = { 'straight':'Straight','slight right':'SlightRight','right':'Right','sharp right':'SharpRight','slight left':'SlightLeft','left':'Left','sharp left':'SharpLeft','uturn':'TurnAround' };
  return m[mod] || 'Straight';
}

function toHungarian(type, mod, road) {
  if (type === 'depart') return road ? 'Indulás: ' + road : 'Indulás';
  if (type === 'arrive') return 'Megérkeztél';
  if (type === 'roundabout' || type === 'rotary') return 'Körforgalom';
  const m = { 'straight':'Előre','slight right':'Tartsd jobbra','right':'Jobbra','sharp right':'Éles jobb','slight left':'Tartsd balra','left':'Balra','sharp left':'Éles bal','uturn':'Fordulj vissza' };
  const base = m[mod] || 'Előre';
  return road ? base + ': ' + road : base;
}

/* ── NAVIGATION ── */
const ARROWS = {
  Straight:            'M28 8L28 48M28 8L16 20M28 8L40 20',
  SlightRight:         'M16 48C16 32 34 32 34 18M34 18L24 18M34 18L34 28',
  Right:               'M14 28L14 12L42 12M42 12L32 4M42 12L32 20',
  SharpRight:          'M14 44L14 22C14 12 24 12 24 22L24 36C24 46 44 46 44 32M44 32L36 24M44 32L36 40',
  SlightLeft:          'M40 48C40 32 22 32 22 18M22 18L32 18M22 18L22 28',
  Left:                'M42 28L42 12L14 12M14 12L24 4M14 12L24 20',
  SharpLeft:           'M42 44L42 22C42 12 32 12 32 22L32 36C32 46 12 46 12 32M12 32L20 24M12 32L20 40',
  TurnAround:          'M28 8L28 34C28 42 20 42 18 36M18 36L12 28M18 36L26 28',
  Roundabout:          'M14 28C14 20.3 20.3 14 28 14C35.7 14 42 20.3 42 28C42 35.7 35.7 42 28 42M42 22L42 14L34 14',
  DestinationReached:  'M10 28L22 40L46 14',
};

D.startBtn.addEventListener('click', startNav);
D.stopBtn.addEventListener('click', stopNav);

function startNav() {
  if (!S.dest || !S.pos) return;
  S.nav = true; S.track = true; S.stepIdx = 0;
  D.topBar.style.display = 'none';
  D.tp.classList.add('on');
  D.stopBtn.style.display = 'block';
  D.startBtn.style.display = 'none';
  D.recenter.style.display = 'none';
  positionStopBtn();
  if (S.steps.length) applyStep(S.steps[0]);
  map.easeTo({ center: [S.pos.lng, S.pos.lat], zoom: 17, pitch: 60, duration: 800 });
  toast('Navigáció elindult 🚀');
}

function stopNav() {
  S.nav = false; S.track = true; S.stepIdx = 0;
  D.topBar.style.display = 'flex';
  D.tp.classList.remove('on');
  D.stopBtn.style.display = 'none';
  D.startBtn.style.display = 'none';
  D.routeRow.style.display = 'none';
  removeRoute();
  if (destMarker) { destMarker.remove(); destMarker = null; }
  S.dest = null;
  D.si.value = ''; D.clearBtn.style.display = 'none';
  D.roadMain.textContent = 'Navigáció leállítva'; D.roadSub.textContent = '';
  map.easeTo({ pitch: 45, bearing: 0, duration: 600 });
  toast('Navigáció leállítva');
}

function positionStopBtn() {
  requestAnimationFrame(() => {
    D.stopBtn.style.top = (D.tp.getBoundingClientRect().bottom + 12) + 'px';
  });
}
window.addEventListener('resize', () => { if (S.nav) positionStopBtn(); });

function applyStep(step) {
  D.tpath.setAttribute('d', ARROWS[step.type] || ARROWS.Straight);
  D.tdist.textContent = step.distance > 0 ? fmtDist(step.distance) : 'Most';
  D.troad.textContent = step.text || step.road || 'Előre';
  D.tp.style.background = step.type === 'DestinationReached' ? 'var(--green)' : 'var(--acc)';
  if (step.road) D.roadMain.textContent = step.road;
}

function syncStep() {
  if (!S.steps.length || !S.pos) return;
  const step = S.steps[S.stepIdx];
  if (!step) return;
  if (step.waypoint) {
    const dist = haversine(S.pos.lat, S.pos.lng, step.waypoint.lat, step.waypoint.lng);
    applyStep({ ...step, distance: dist });
    if (dist < 25 && S.stepIdx < S.steps.length - 1) {
      S.stepIdx++;
      if (S.steps[S.stepIdx]?.type === 'DestinationReached') {
        applyStep(S.steps[S.stepIdx]);
        toast('🏁 Megérkeztél!', 5000);
        setTimeout(stopNav, 7000);
      }
    }
  } else { applyStep(step); }
}

/* ── REPORTS ── */
document.querySelectorAll('.rpt').forEach(btn => {
  btn.addEventListener('click', () => {
    if (!S.pos) { toast('GPS szükséges'); return; }
    const { icon, label } = btn.dataset;
    const el = document.createElement('div');
    el.style.cssText = 'font-size:28px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.6));';
    el.textContent = icon;
    const mk = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([S.pos.lng, S.pos.lat])
      .setPopup(new maplibregl.Popup({ closeButton: false, offset: 20 })
        .setHTML(`<b>${label}</b><br><small>${new Date().toLocaleTimeString('hu')}</small>`))
      .addTo(map);
    setTimeout(() => mk.remove(), 3_600_000);
    toast(`${icon} ${label} bejelentve!`);
  });
});

/* ── MAP CONTROLS ── */
$('zin').addEventListener('click', () => map.zoomIn());
$('zout').addEventListener('click', () => map.zoomOut());
D.recenter.addEventListener('click', () => {
  S.track = true;
  if (S.pos) map.easeTo({ center: [S.pos.lng, S.pos.lat], duration: 500 });
  D.recenter.style.display = 'none';
});
D.tiltBtn.addEventListener('click', () => {
  S.is3d = !S.is3d;
  D.tiltBtn.classList.toggle('on', S.is3d);
  D.tiltBtn.textContent = S.is3d ? '3D' : '2D';
  map.easeTo({ pitch: S.is3d ? 45 : 0, duration: 600 });
  const bld = map.getLayer('nova-bld-3d');
  if (bld) map.setLayoutProperty('nova-bld-3d', 'visibility', S.is3d ? 'visible' : 'none');
  toast(S.is3d ? '3D nézet' : '2D nézet');
});
map.on('drag', () => { S.track = false; if (!S.nav) D.recenter.style.display = 'flex'; });

/* ── STATUS / LOADING ── */
function showStatus(msg) { D.status.textContent = msg; D.status.style.display = 'block'; }
function hideStatus() { D.status.style.display = 'none'; }
function hideLoading(d=300) {
  setTimeout(() => {
    D.loading.style.opacity = '0';
    setTimeout(() => D.loading.style.display = 'none', 600);
  }, d);
}

/* ── INIT ── */
initGPS();
</script>
</body>
</html>
